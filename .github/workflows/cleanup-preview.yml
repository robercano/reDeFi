name: Cleanup SST Preview Backend

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-backend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed if you use OIDC for AWS auth, or you can use secrets
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Replace these with your actual AWS role or use access keys if preferred
          aws-region: eu-north-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Remove SST PR Stage
        # Amplify creates branches named 'pr-123' for PR previews
        run: npx sst remove --stage pr-${{ github.event.pull_request.number }} --non-interactive
