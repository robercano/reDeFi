name: Deploy Backend
on:
  push:
    branches:
      - main
    paths:
      - 'apps/api-server/**'
      - 'packages/**'
      - 'sst.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy SST Backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    env:
      AWS_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SDK_API_KEY: ${{ secrets.SDK_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.9

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        env:
          PROD_ENV: ${{ secrets.PRODUCTION_DOTENV }}
        run: |
          echo "$PROD_ENV" > .env
          sed -i '/^AWS_PROFILE=/d' .env

      - name: Deploy Backend
        run: npx sst deploy --stage main
