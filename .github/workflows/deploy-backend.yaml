name: Deploy Backend
on:
  push:
    branches:
      - main
    paths:
      - 'apps/api-server/**'
      - 'packages/**'
      - 'sst.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy SST Backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    env:
      AWS_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.9

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        env:
          COINGECKO_API_URL: ${{ secrets.COINGECKO_API_URL }}
          COINGECKO_API_VERSION: ${{ secrets.COINGECKO_API_VERSION }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_AUTH_HEADER: ${{ secrets.COINGECKO_API_AUTH_HEADER }}
          COINGECKO_SUPPORTED_CHAIN_IDS: ${{ secrets.COINGECKO_SUPPORTED_CHAIN_IDS }}
          ONE_INCH_API_URL: ${{ secrets.ONE_INCH_API_URL }}
          ONE_INCH_API_VERSION: ${{ secrets.ONE_INCH_API_VERSION }}
          ONE_INCH_API_KEY: ${{ secrets.ONE_INCH_API_KEY }}
          ONE_INCH_API_AUTH_HEADER: ${{ secrets.ONE_INCH_API_AUTH_HEADER }}
          ONE_INCH_SWAP_CHAIN_IDS: ${{ secrets.ONE_INCH_SWAP_CHAIN_IDS }}
          COW_SWAP_API_URL: ${{ secrets.COW_SWAP_API_URL }}
          COW_SWAP_API_KEY: ${{ secrets.COW_SWAP_API_KEY }}
          COW_SWAP_API_VERSION: ${{ secrets.COW_SWAP_API_VERSION }}
          COW_SWAP_API_AUTH_HEADER: ${{ secrets.COW_SWAP_API_AUTH_HEADER }}
          COW_SWAP_SUPPORTED_CHAIN_IDS: ${{ secrets.COW_SWAP_SUPPORTED_CHAIN_IDS }}
          ONE_INCH_ALLOWED_SWAP_PROTOCOLS: ${{ secrets.ONE_INCH_ALLOWED_SWAP_PROTOCOLS }}
          ONE_INCH_EXCLUDED_SWAP_PROTOCOLS: ${{ secrets.ONE_INCH_EXCLUDED_SWAP_PROTOCOLS }}
          ONE_INCH_API_SPOT_CHAIN_IDS: ${{ secrets.ONE_INCH_API_SPOT_CHAIN_IDS }}
          ONE_INCH_API_SPOT_URL: ${{ secrets.ONE_INCH_API_SPOT_URL }}
          ONE_INCH_API_SPOT_VERSION: ${{ secrets.ONE_INCH_API_SPOT_VERSION }}
          ONE_INCH_API_SPOT_KEY: ${{ secrets.ONE_INCH_API_SPOT_KEY }}
          ONE_INCH_API_SPOT_AUTH_HEADER: ${{ secrets.ONE_INCH_API_SPOT_AUTH_HEADER }}
          SDK_RPC_GATEWAY: ${{ secrets.SDK_RPC_GATEWAY }}
          ALCHEMY_ENDPOINT_API_KEY: ${{ secrets.ALCHEMY_ENDPOINT_API_KEY }}
          SDK_LOGGING_ENABLED: ${{ secrets.SDK_LOGGING_ENABLED }}
          SDK_DEBUG_ENABLED: ${{ secrets.SDK_DEBUG_ENABLED }}
          SDK_USE_FORK: ${{ secrets.SDK_USE_FORK }}
          SDK_FORK_CONFIG: ${{ secrets.SDK_FORK_CONFIG }}
          SDK_API_KEY: ${{ secrets.SDK_API_KEY }}
          E2E_SDK_FORK_URL_MAINNET: ${{ secrets.E2E_SDK_FORK_URL_MAINNET }}
          ENVIRONMENT_TAG: ${{ secrets.ENVIRONMENT_TAG }}
          SDK_DEPLOYED_VERSIONS_MAP: ${{ secrets.SDK_DEPLOYED_VERSIONS_MAP }}
        run: |
          cat << EOF > .env
          COINGECKO_API_URL=$COINGECKO_API_URL
          COINGECKO_API_VERSION=$COINGECKO_API_VERSION
          COINGECKO_API_KEY=$COINGECKO_API_KEY
          COINGECKO_API_AUTH_HEADER=$COINGECKO_API_AUTH_HEADER
          COINGECKO_SUPPORTED_CHAIN_IDS=$COINGECKO_SUPPORTED_CHAIN_IDS
          ONE_INCH_API_URL=$ONE_INCH_API_URL
          ONE_INCH_API_VERSION=$ONE_INCH_API_VERSION
          ONE_INCH_API_KEY=$ONE_INCH_API_KEY
          ONE_INCH_API_AUTH_HEADER=$ONE_INCH_API_AUTH_HEADER
          ONE_INCH_SWAP_CHAIN_IDS=$ONE_INCH_SWAP_CHAIN_IDS
          COW_SWAP_API_URL=$COW_SWAP_API_URL
          COW_SWAP_API_KEY=$COW_SWAP_API_KEY
          COW_SWAP_API_VERSION=$COW_SWAP_API_VERSION
          COW_SWAP_API_AUTH_HEADER=$COW_SWAP_API_AUTH_HEADER
          COW_SWAP_SUPPORTED_CHAIN_IDS=$COW_SWAP_SUPPORTED_CHAIN_IDS
          ONE_INCH_ALLOWED_SWAP_PROTOCOLS=$ONE_INCH_ALLOWED_SWAP_PROTOCOLS
          ONE_INCH_EXCLUDED_SWAP_PROTOCOLS=$ONE_INCH_EXCLUDED_SWAP_PROTOCOLS
          ONE_INCH_API_SPOT_CHAIN_IDS=$ONE_INCH_API_SPOT_CHAIN_IDS
          ONE_INCH_API_SPOT_URL=$ONE_INCH_API_SPOT_URL
          ONE_INCH_API_SPOT_VERSION=$ONE_INCH_API_SPOT_VERSION
          ONE_INCH_API_SPOT_KEY=$ONE_INCH_API_SPOT_KEY
          ONE_INCH_API_SPOT_AUTH_HEADER=$ONE_INCH_API_SPOT_AUTH_HEADER
          SDK_RPC_GATEWAY=$SDK_RPC_GATEWAY
          ALCHEMY_ENDPOINT_API_KEY=$ALCHEMY_ENDPOINT_API_KEY
          SDK_LOGGING_ENABLED=$SDK_LOGGING_ENABLED
          SDK_DEBUG_ENABLED=$SDK_DEBUG_ENABLED
          SDK_USE_FORK=$SDK_USE_FORK
          SDK_FORK_CONFIG=$SDK_FORK_CONFIG
          SDK_API_KEY=$SDK_API_KEY
          E2E_SDK_FORK_URL_MAINNET=$E2E_SDK_FORK_URL_MAINNET
          ENVIRONMENT_TAG=$ENVIRONMENT_TAG
          SDK_DEPLOYED_VERSIONS_MAP=$SDK_DEPLOYED_VERSIONS_MAP
          EOF

      - name: Deploy Backend
        run: npx sst deploy --stage development
