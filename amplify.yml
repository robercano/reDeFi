version: 1
applications:
  - appRoot: apps/sdk-demo
    frontend:
      phases:
        preBuild:
          commands:
            # Install Node 24 to respect package.json engines constraint
            - nvm install 24
            - nvm use 24
            # Install pnpm and dependencies at the root level
            - corepack enable pnpm
            - pnpm config set store-dir .pnpm-store
            - pnpm install
            # Deploy or update the SST backend for the current branch
            - npx sst deploy --stage $AWS_BRANCH
        build:
          commands:
            # Run Turborepo build from the workspace root
            - pnpm turbo run build --filter=sdk-demo
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.pnpm-store/**/*
          - ../../node_modules/**/*

  - appRoot: apps/docs
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - corepack enable pnpm
            - pnpm config set store-dir .pnpm-store
            - pnpm install
        build:
          commands:
            - pnpm run cicheck
            - pnpm turbo run build --filter=docs
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.pnpm-store/**/*
          - ../../node_modules/**/*
