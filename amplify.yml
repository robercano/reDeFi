version: 1
applications:
  - appRoot: apps/sdk-demo
    frontend:
      phases:
        preBuild:
          commands:
            # Install Node 24 to respect package.json engines constraint
            - nvm install 24
            - nvm use 24
            # Install pnpm and dependencies at the root level
            - corepack enable pnpm
            - pnpm install
            # Deploy the SST backend using the branch name as the stage
            - npx sst deploy --stage pr-$AWS_BRANCH --non-interactive
        build:
          commands:
            # Run Turborepo build from the workspace root
            - pnpm turbo run build --filter=sdk-demo
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*

  - appRoot: apps/docs
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - corepack enable pnpm
            - pnpm install
        build:
          commands:
            - pnpm turbo run build --filter=docs
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*
